<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="haze-bg" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181b"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="haze-accent" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  <!-- Background Plate -->
  <rect width="32" height="32" rx="7" fill="url(#haze-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="rgba(255,255,255,0.18)"/>
  
  <!-- Left Pillar -->
  <rect x="7" y="7.5" width="3" height="17" rx="1.5" fill="url(#haze-accent)"/>
  
  <!-- Right Pillar -->
  <rect x="22" y="7.5" width="3" height="17" rx="1.5" fill="url(#haze-accent)"/>
  
  <!-- Connecting Crossbar -->
  <rect x="8.5" y="14.5" width="15" height="3" rx="1.5" fill="#ffffff"/>
  
  <!-- Center Equalizer Pulse & Story Node -->
  <rect x="14.75" y="9.5" width="2.5" height="13" rx="1.25" fill="#ffffff"/>
  <circle cx="16" cy="16" r="2.2" fill="#09090b"/>
  <circle cx="16" cy="16" r="1.1" fill="#ffffff"/>
</svg>
